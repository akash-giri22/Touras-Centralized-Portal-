version: "3.9"

services:
  touras-portal:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: touras-portal
    image: touras-portal:latest
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

